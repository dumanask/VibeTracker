name: New agent support
description: An agent CLI or editor that is not being read
labels: [adapter]
body:
  - type: markdown
    attributes:
      value: |
        Writing an adapter takes knowing **what** the agent writes to disk. The
        answers to the three questions below are most of the work.

        Do not paste file **contents** — they carry prompts and code. What is
        wanted is shapes: the directory layout, field names, record types.
  - type: input
    id: agent
    attributes:
      label: Agent
      description: Name and version
    validations:
      required: true
  - type: textarea
    id: layout
    attributes:
      label: State directory
      description: |
        Where does it live and what is in it? An `ls` listing is enough.
      render: text
    validations:
      required: true
  - type: textarea
    id: shape
    attributes:
      label: Record shapes
      description: |
        For JSONL, the line types and the field **names**; for SQLite, the
        output of `select sql from sqlite_master where type='table'`.
        Names, not values.
      render: text
  - type: checkboxes
    id: signals
    attributes:
      label: What you could find
      options:
        - label: It writes a process id (pid)
        - label: The start and end of a turn can be told apart
        - label: A tool call can be matched with its result
        - label: The working directory (cwd) is recorded
