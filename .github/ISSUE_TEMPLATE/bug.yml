name: Bug
description: It shows something wrong, crashes, or a capability does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Run `vt doctor` first.** Its output answers "what works and what does
        not on this machine", and it places most bugs at a glance.

        Do not paste prompts, code or file contents. If a diagnostics bundle is
        needed, `vt doctor --bundle` collects by allowlist, redacts, and shows
        you the contents before writing the file.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you see on screen, and what did you expect to see?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: vt doctor output
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "`vt --version` and your operating system"
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Which agent
      multiple: true
      options:
        - Claude Code
        - Codex
        - opencode
        - Kilo
        - Cline
        - Gemini
        - VS Code / Copilot
        - Cursor
        - Antigravity
        - Trae
        - None / general
