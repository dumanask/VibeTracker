name: release

# Desktop builds, one per platform, on the platform.
#
# Tauri does not cross-compile in any way worth relying on: the bundle format,
# the icon container, the webview binding and the signing story are all
# per-platform. So this is not a convenience — it is the only way macOS and
# Linux artifacts exist at all, and the only place they get tested, because the
# machine this was written on runs Windows.
#
# Nothing here signs anything yet. Unsigned builds raise SmartScreen on Windows
# and are refused by Gatekeeper on macOS without a right-click; that is stated
# in the release notes rather than papered over. Signing needs certificates,
# which need an identity and a paid programme, and both are the maintainer's
# decision to make.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build but do not create a release'
        type: boolean
        default: true

permissions:
  contents: write

env:
  NODE_OPTIONS: --no-warnings=ExperimentalWarning

jobs:
  # The npm package first. It is the artifact most people will actually use, it
  # takes a minute, and there is no point building three desktop bundles for a
  # commit whose tests do not pass.
  npm:
    name: npm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      # `architecture` is what makes the Intel build honest: it decides which
      # Node ends up inside the bundle, because the staging script copies the
      # interpreter that runs it.
      - uses: actions/setup-node@v4
        with: { node-version: '22.20', architecture: '${{ matrix.node }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: pack
        run: node scripts/pack.mjs
      - name: the licence really is in the package
        run: |
          test -f .pack/LICENSE || { echo "LICENSE is missing"; exit 1; }
          test -f .pack/NOTICE  || { echo "NOTICE is missing";  exit 1; }
          node -e "
            const p = require('./.pack/package.json');
            if (p.license !== 'Apache-2.0') { console.error('license:', p.license); process.exit(1) }
            if (p.scripts && p.scripts.prepublishOnly) { console.error('publishing is still blocked'); process.exit(1) }
            if (Object.keys(p.dependencies || {}).length) { console.error('there is a dependency'); process.exit(1) }
          "
      # The one check that would have caught the worst bug this package ever
      # had. Sources ship as `.ts` in the repository and Node runs them
      # directly, but an installed package lives under `node_modules`, where
      # Node refuses to strip types — so a tarball of TypeScript installs
      # cleanly and dies on first run. CI has asserted this since it was
      # written; it had simply never run, because the repository had never been
      # pushed. Asserted here too, because a release is the last place to find
      # out.
      - name: the installed package actually starts
        run: |
          npm pack ./.pack --pack-destination /tmp
          mkdir -p /tmp/probe && cd /tmp/probe && npm init -y > /dev/null
          npm install /tmp/vibetracker-*.tgz
          node node_modules/vibetracker/bin/vt.mjs --help | head -3
          node node_modules/vibetracker/bin/vt.mjs --lang en demo --json > /dev/null

      - name: tarball
        run: cd .pack && npm pack --pack-destination ..
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: '*.tgz'

  desktop:
    name: ${{ matrix.name }}
    needs: npm
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, key: windows, name: 'Windows', args: '', node: x64 }
          - { os: macos-latest, key: macos-arm64, name: 'macOS (Apple Silicon)',
              args: '--target aarch64-apple-darwin', rust: aarch64-apple-darwin, node: arm64 }
          # Cross-compiled: `macos-13` was retired, and the v0.1.0 run sat
          # queued on it for eighty minutes with no runner ever assigned. The
          # x64 Node is not incidental -- `desktop-stage.mjs` bundles the Node
          # running it, so without this the Intel app would carry an arm64
          # runtime and fail to start on an Intel Mac.
          - { os: macos-latest, key: macos-x64, name: 'macOS (Intel)',
              args: '--target x86_64-apple-darwin', rust: x86_64-apple-darwin, node: x64 }
          - { os: ubuntu-22.04, key: linux, name: 'Linux', args: '', node: x64 }
    steps:
      - uses: actions/checkout@v4

      # Tauri's Linux backend is WebKitGTK, and the packagers for .deb and
      # AppImage are separate tools. None of this is needed on the other two.
      #
      # Only the ayatana tray library, never both: `libappindicator3-dev`
      # Conflicts with it, so asking apt for the pair is an impossible request
      # and the job dies with "held broken packages" before compiling a line.
      # Tauri 2 uses ayatana; ci.yml has always installed only that one, which
      # is why the desktop check was green while the release build was not.
      - name: linux dependencies
        if: matrix.key == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: '22.20', cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # The icons are generated, not committed as binaries — see
      # scripts/make-icon.mjs for why. So they have to exist before the bundler
      # looks for them.
      - name: icons
        run: node scripts/make-icon.mjs

      # The runtime that gets bundled is whichever Node this job set up, so the
      # artifact carries the same version the tests just ran against — and, on
      # each platform, that platform's binary. This is the step that cannot be
      # done anywhere but here.
      - name: stage the runtime
        run: node scripts/desktop-stage.mjs

      - name: build
        working-directory: packages/desktop
        run: pnpm exec tauri build ${{ matrix.args }}

      - name: the staged runtime belongs to this platform
        shell: bash
        run: |
          node -e "
            const { readdirSync, statSync } = require('node:fs');
            const dir = 'packages/desktop/src-tauri/runtime';
            const names = readdirSync(dir);
            const bin = names.find(n => n === 'node' || n === 'node.exe');
            if (!bin) { console.error('no runtime:', names); process.exit(1) }
            const mb = statSync(dir + '/' + bin).size / 1e6;
            console.log(process.platform, process.arch, bin, mb.toFixed(1) + ' MB');
            if (mb < 20) { console.error('the runtime is suspiciously small'); process.exit(1) }
            if (process.arch !== '${{ matrix.node }}') {
              console.error('staged a ' + process.arch + ' runtime for a ${{ matrix.node }} build');
              process.exit(1);
            }
          "

      # The bundled Node has to match what the app was compiled for, and on the
      # cross-compiled job the two come from different places. `file` is the
      # cheapest thing that can tell them apart, and getting this wrong ships a
      # .dmg that crashes on launch for precisely the users it exists for.
      - name: the bundled runtime matches the build target
        if: runner.os == 'macOS'
        run: |
          file packages/desktop/src-tauri/runtime/node
          case "${{ matrix.node }}" in
            x64)   file packages/desktop/src-tauri/runtime/node | grep -q 'x86_64' ;;
            arm64) file packages/desktop/src-tauri/runtime/node | grep -q 'arm64' ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.key }}
          path: |
            packages/desktop/src-tauri/target/**/release/bundle/nsis/*-setup.exe
            packages/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            packages/desktop/src-tauri/target/**/release/bundle/deb/*.deb
            packages/desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  publish:
    name: draft release
    needs: [npm, desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/**/*
          body: |
            ## Installing

            **If you have Node** — `npm i -g vibetracker`, then `vt init`.

            **The desktop app** — download the package for your platform. Node is
            not required: the package carries its own runtime.

            ### These packages are not signed

            **Windows** — SmartScreen will show a warning: "More info" →
            "Run anyway".

            **macOS** — the packages are neither signed nor notarized. The
            "right click → Open" route described in older guides stopped working
            with macOS 15: try to open the app once, and when it is refused go to
            **System Settings → Privacy & Security** and press the
            "Open Anyway" button there.

            **Linux** — the `.deb` needs WebKitGTK 4.1 (Ubuntu 22.04+, Debian
            12+). On an older distribution use the `.AppImage`; `chmod +x` it
            after downloading.

            Signing needs a certificate and one has not been obtained yet — a gap
            that should be stated honestly rather than hidden.

            If you want to check what the package does: the source is Apache-2.0
            and the code the app carries sits readable, not compiled, under
            `resources/runtime/`.
