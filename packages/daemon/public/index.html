<!doctype html>
<html lang="__VT_LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>VibeTracker</title>
<style>
  /* ── the instrument ─────────────────────────────────────────────────────
     One product, one surface.

     The note window is a painted WinForms panel and this is a web page, and
     for a while they looked like two different products: rounded pills, system
     sans and a light theme here; sharp rectangles, phosphor and scanlines
     there. Same numbers, two personalities — and the one you glance at all day
     is the note.

     So the note is the source, not the inspiration. Every colour below is
     lifted from its palette (note.ps1 §208–218) under the same names, every
     metric from its layout constants, and its three drawing habits — the
     scanline wash, the one-pixel bevel, the ten-segment meter — are rebuilt
     here rather than reinvented. What the two share is now a grammar.

     Dark only, and that is a decision rather than an omission. The note has no
     light mode and cannot have one: phosphor on black is the whole idea. A
     dashboard that turned white in the morning would break the resemblance at
     exactly the moment both are on screen. */
  :root {
    color-scheme: dark;

    /* Lifted from note.ps1. Same names, same values. */
    --base:#070a0f; --panel:#0d121a; --trough:#161e29;
    --edge:#1d2633; --bevel:#2a3646;
    --ink:#e6f2ec; --dim:#6b7a8c;
    --phos:#3fe89c; --amber:#ffb24a; --alarm:#ff5c4a; --cyan:#4ae8d0;

    /* The names the markup already speaks, mapped onto that palette so every
       rule below reads in one vocabulary and the renderers need no edit to
       follow. The mapping is the note's own: running is phosphor, waiting is
       amber, urgency 3 is alarm (note.ps1 KindColor), and cyan is reserved for
       measurement — the progress meter and nothing else, so a lit segment
       never has to compete with a state for the same colour. */
    --bg:var(--base); --fg:var(--ink); --muted:var(--dim);
    --line:var(--edge); --card:var(--panel); --raise:var(--trough);
    --busy:var(--phos); --wait:var(--amber); --perm:var(--alarm);
    --warn:var(--amber); --idle:var(--dim);

    --mono: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace;
    --sans: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;

    /* note.ps1: RowH 34, BarH 26, LoadH 22, PadX 10, GapX 10. */
    --row:34px; --pad:10px; --gap:10px;
    /* MeterW 78 = ten segments of 6 with 2 between. Kept as three variables
       because the meter is rebuilt from them in three places, and a meter
       whose segments did not line up with the note's would be the one detail
       that gave away that these are two programs. */
    --seg:6px; --seggap:2px; --meter:78px;
  }

  * { box-sizing:border-box; }

  body {
    margin:0; background:var(--base); color:var(--ink);
    font:13px/1.45 var(--mono);
    -webkit-font-smoothing:antialiased;
  }

  /* The scanline wash.
     note.ps1 draws one line every 3px at alpha 14/255 — 0.055 — and the
     comment there is the specification: enough that the surface reads as a
     readout rather than a small web page, far too little to interfere with
     text. Fixed rather than tiled per element so it does not scroll with the
     content, which would make it a texture on the page instead of a property
     of the glass in front of it. */
  body::before {
    content:''; position:fixed; inset:0; z-index:9; pointer-events:none;
    background:repeating-linear-gradient(
      180deg, rgba(255,255,255,.055) 0 1px, transparent 1px 3px);
  }
  @media print { body::before { display:none; } }

  .wrap { max-width:1020px; margin:0 auto; padding:18px 16px 56px; }

  /* ── the title strip ───────────────────────────────────────────────────
     note.ps1 paints a 26px strip with the product name letter-spaced by 1.6px
     (Spaced()) and the waiting count in amber at its right. Same here. */
  header {
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    background:var(--panel); border:1px solid var(--edge);
    padding:0 var(--pad); min-height:30px;
  }
  /* Letter-spaced, never uppercased. note.ps1 draws the title the same way and
     for the same reason: casing a brand is a decision the locale should not be
     making. Under lang="tr" the browser correctly turns "VibeTracker" into
     "VİBETRACKER", which is the right transformation of the wrong string. */
  h1 { font-size:12.5px; margin:0; font-weight:700; letter-spacing:.14em;
       color:var(--ink); font-family:var(--mono); }
  .conn { font-size:10.5px; font-family:var(--mono); padding:1px 7px;
          border:1px solid var(--bevel); color:var(--dim); letter-spacing:.04em; }
  .conn.live { color:var(--phos); border-color:currentColor; }
  .conn.down { color:var(--alarm); border-color:currentColor; }
  .meta { color:var(--dim); font-size:10.5px; font-family:var(--mono);
          padding:6px var(--pad) 0; letter-spacing:.02em; }

  /* ── fleet load ────────────────────────────────────────────────────────
     Of the sessions alive right now, what share is engaged. Deliberately not
     an average of the progress meters below it: a plan that grows makes that
     number fall while work is being done. Two colours in one track, because
     "everything is running" and "everything is blocked" are the same load and
     opposite situations.

     Segmented like every other bar on both surfaces — the mask below is the
     note's 6-and-2 grammar applied to a track of arbitrary width. */
  .load { display:flex; align-items:center; gap:var(--gap); margin:0;
          padding:5px var(--pad); background:var(--panel);
          border:1px solid var(--edge); border-top:0;
          font-size:10.5px; font-family:var(--mono); color:var(--dim);
          letter-spacing:.04em; }
  .load .track { flex:0 1 360px; height:8px; display:flex; background:var(--trough);
    -webkit-mask:repeating-linear-gradient(90deg,#000 0 var(--seg),
      transparent var(--seg) calc(var(--seg) + var(--seggap)));
    mask:repeating-linear-gradient(90deg,#000 0 var(--seg),
      transparent var(--seg) calc(var(--seg) + var(--seggap))); }
  .load .track.none { background:none; border:1px dotted var(--bevel);
                      -webkit-mask:none; mask:none; }
  .load .run  { background:var(--phos); }
  .load .wait { background:var(--amber); }
  .load .pc { color:var(--ink); min-width:34px; text-align:start;
              font-variant-numeric:tabular-nums; }

  /* ── counters ──────────────────────────────────────────────────────────
     The note sets its one number in Consolas 20 bold (fLcd). The web
     equivalent is a tabular monospace at a size nothing else on the page
     uses, so the eye finds the counts without needing a heading to point. */
  .stats { display:flex; flex-wrap:wrap; gap:4px 20px; padding:10px var(--pad) 8px; }
  .stat b { font-size:21px; font-weight:700; font-family:var(--mono);
            font-variant-numeric:tabular-nums; letter-spacing:-.02em;
            color:var(--ink); }
  .stat span { color:var(--dim); font-size:10.5px; margin-inline-start:6px;
               letter-spacing:.04em; }
  .stat.alert b { color:var(--alarm); }

  /* ── capability chips ──────────────────────────────────────────────────
     Square, one pixel, monospace: the note's button grammar at label width. */
  .caps { display:flex; flex-wrap:wrap; gap:4px; padding:0 var(--pad) 10px; }
  .cap { font-size:10px; font-family:var(--mono); padding:1px 6px;
         border:1px solid var(--edge); color:var(--dim); cursor:help;
         letter-spacing:.02em; }
  .cap.ok  { color:var(--phos); border-color:color-mix(in srgb,var(--phos) 34%,transparent); }
  .cap.bad { color:var(--amber); border-color:var(--amber); }

  .warn { border-inline-start:2px solid var(--amber); background:var(--panel);
          padding:7px 11px; margin:6px var(--pad); font-size:11.5px; }

  /* Section headings as instrument labels: a word, spaced out, and a rule
     that runs to the edge of the panel it names. */
  h2 { font-size:10px; text-transform:uppercase; letter-spacing:.22em;
       color:var(--dim); margin:22px 0 7px; font-weight:600;
       font-family:var(--mono); display:flex; align-items:center; gap:10px; }
  h2::after { content:''; flex:1; height:1px; background:var(--edge); }

  /* ── the beat ──────────────────────────────────────────────────────────
     note.ps1 advances one phase angle by 0.22 rad every 90ms, so a cycle is
     2π/0.22 × 90ms ≈ 2.57s — and it runs *only* while something is waiting or
     working, because an idle board that burned a core to look alive would be
     a worse tool than a still one. The same restraint applies here: the
     animation is attached to the waiting and running classes and to nothing
     else, so a quiet board is a still page. */
    /* A reading, not a measurement: amber rather than phosphor, dashed rather
     than solid, and always prefixed with a tilde in the markup. */
  .phase.guess, .pct.guess, .pc.guess { color:var(--amber); }
  .prov.guess { color:var(--amber); opacity:.8; }
  .bar.guess { background:none; border:1px dashed var(--bevel); box-sizing:border-box; }
  .bar.guess > i { background:none; border-right:1px solid var(--amber);
                   background-image:repeating-linear-gradient(135deg,
                     rgba(255,178,74,.5) 0 2px, transparent 2px 4px); mask:none; }

  /* The LLM summary, framed so it cannot be read as a counted number.
     Dashed rather than solid, and offset in the amber of a claim rather than
     the phosphor of a measurement. */
  .digest { margin:8px 0 2px; padding:8px var(--pad); border:1px dashed var(--bevel);
            background:rgba(255,178,74,.04); }
  .dg-head { font-family:var(--mono); font-size:10.5px; letter-spacing:.08em;
             text-transform:uppercase; color:var(--amber); }
  .dg-kind { color:var(--dim); text-transform:none; letter-spacing:0; margin-left:6px; }
  .dg-phase { font-weight:600; margin-top:4px; }
  .dg-sum { margin-top:4px; color:var(--ink); }
  .dg-line { margin-top:3px; font-size:12px; }
  .dg-line b { color:var(--dim); font-weight:500; margin-right:4px; }
  .dg-bad b, .dg-bad { color:var(--alarm); }
  .dg-warn { color:var(--amber); }
  .dg-ev { margin-top:5px; font-family:var(--mono); font-size:10.5px; color:var(--dim);
           overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  @keyframes vt-breath { 0%,100% { opacity:.55 } 50% { opacity:1 } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation:none !important; }
    body::before { background:none; }
  }

  /* ── seni bekleyenler ──────────────────────────────────────────────────
     One row per blocked session, most urgent first. The left rule carries the
     urgency, and an alarm row is the only thing on the page allowed to
     breathe: if everything pulsed, nothing would. */
  .waiting { display:grid; gap:1px; background:var(--edge);
             border:1px solid var(--edge); }
  .wrow { display:flex; align-items:center; gap:var(--gap);
          padding:0 var(--pad); min-height:var(--row); background:var(--panel);
          border-inline-start:2px solid var(--bevel); }
  .wrow.u1 { border-inline-start-color:var(--amber); }
  .wrow.u2 { border-inline-start-color:var(--amber); }
  .wrow.u3 { border-inline-start-color:var(--alarm);
             animation:vt-breath 2.57s ease-in-out infinite; }
  .wrow .proj { font-family:var(--sans); font-weight:700; font-size:12.5px;
                min-width:120px; color:var(--ink); }
  .wrow .sess { font-family:var(--mono); font-size:10.5px; color:var(--dim);
                min-width:150px; }
  .wrow .grow { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis;
                white-space:nowrap; color:var(--dim); font-size:11.5px; }
  .dwell { font-family:var(--mono); font-size:11.5px; font-weight:700;
           white-space:nowrap; color:var(--ink);
           font-variant-numeric:tabular-nums; }

  /* ── the project list ──────────────────────────────────────────────────
     A grid rather than flexbox so the columns line up down the whole list — a
     ragged left edge is what makes twelve rows unreadable. */
  .plist { border:1px solid var(--edge); background:var(--edge);
           display:grid; gap:1px; }
  .prow { display:grid; align-items:center; gap:var(--gap); width:100%;
    text-align:start;
    grid-template-columns:12px minmax(0,1fr) 110px 92px 92px 56px var(--meter) 46px;
    padding:0 var(--pad); min-height:var(--row); background:var(--panel);
    border:0; color:inherit; font:inherit; font-family:var(--mono);
    cursor:pointer; }
  .prow:hover { background:var(--trough); }
  .prow:focus-visible { outline:1px solid var(--cyan); outline-offset:-1px; }
  .prow .nm { font-family:var(--sans); font-weight:700; font-size:12.5px;
              color:var(--ink); overflow:hidden; text-overflow:ellipsis;
              white-space:nowrap; }
  .prow .ag { font-size:11px; font-family:var(--mono); white-space:nowrap;
              overflow:hidden; text-overflow:ellipsis; }
  .prow .xy { font-size:10.5px; font-family:var(--mono); color:var(--dim);
              text-align:end; font-variant-numeric:tabular-nums; }
  .prow .pc { font-size:11px; font-family:var(--mono); text-align:end;
              color:var(--ink); font-variant-numeric:tabular-nums; }
  /* Colour follows the cell, not the row. Waiting is always the waiting
     colour and running always the running one, so a project doing both reads
     as doing both instead of taking one colour for the whole line. */
  .prow .ag.wait { color:var(--amber); }
  .prow.u3 .ag.wait { color:var(--alarm); font-weight:700; }
  .prow .ag.run { color:var(--phos); }
  .prow .ag.wait.off, .prow .ag.run.off { color:var(--dim); font-weight:400; }
  /* Only the live cell breathes, and only the cell — not the row. A pulsing
     line would drag the eye to a project rather than to the fact about it. */
  .prow.u3 .ag.wait { animation:vt-breath 2.57s ease-in-out infinite; }

  /* The last half hour. Minutes nobody watched are simply not drawn, which
     is why this is a polyline with breaks rather than an area chart: a filled
     shape has to sit on a floor, and inventing that floor is the one thing
     this picture must not do. */
  /* The trace takes the slack.
     note.ps1 pins it to 48px because its window is 400 wide; a dashboard that
     did the same left a name, four hundred pixels of nothing, and a cluster of
     readings off to the right. Stretching it is not decoration — the trace is
     twenty-four minutes wide either way, and more pixels per minute is simply
     more of the shape you are trying to read. `preserveAspectRatio="none"`
     does the stretching and `non-scaling-stroke` keeps the line one pixel
     while it happens, so a wide row does not also get a fat line.

     Twice the note's width and no more. Given the whole slack it became a
     two-hundred-pixel rule across every row, and since most traces are flat
     most of the time, the loudest thing on the board was the absence of
     activity. */
  .prow .spark { display:block; width:100%; height:16px; overflow:visible; }
  .prow .spark path { fill:none; stroke-width:1.3; stroke-linejoin:round;
    stroke:var(--dim); opacity:.5; vector-effect:non-scaling-stroke; }
  .prow.waiting .spark path { stroke:var(--amber); opacity:1; }
  .prow.u3 .spark path { stroke:var(--alarm); }
  .prow.running .spark path { stroke:var(--phos); opacity:1; }
  .prow .spark .flat { stroke-dasharray:2 3; opacity:.5; stroke:var(--edge); }

  .prow .why { grid-column:2 / -1; font-size:10.5px; color:var(--dim);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    padding-bottom:5px; margin-top:-6px; }

  /* ── the meter ─────────────────────────────────────────────────────────
     note.ps1 PaintMeter: ten segments, 6 wide and 8 tall, 2 apart, in cyan;
     lit is round(percent/100 × 10) so a segment is never half on. An
     approximate reading is outlined instead of filled and an unknown one is a
     dotted box — how sure we are, said in shape rather than in a word, which
     is what lets a column of them be read at a glance.

     Built with a mask so the fill stays a plain percentage width; the
     renderer rounds to the nearest tenth, exactly as the note rounds to a
     whole segment. */
  .bar { flex:0 0 var(--meter); width:var(--meter); height:8px;
         background:repeating-linear-gradient(90deg, var(--trough) 0 var(--seg),
           transparent var(--seg) calc(var(--seg) + var(--seggap)));
         overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--cyan);
    -webkit-mask:repeating-linear-gradient(90deg,#000 0 var(--seg),
      transparent var(--seg) calc(var(--seg) + var(--seggap)));
    mask:repeating-linear-gradient(90deg,#000 0 var(--seg),
      transparent var(--seg) calc(var(--seg) + var(--seggap))); }
  /* Outlined segments: a hairline along the top and bottom, and one down each
     side of every segment. Hollow means inferred. */
  .bar.approx > i {
    background:
      linear-gradient(var(--cyan),var(--cyan)) 0 0/100% 1px no-repeat,
      linear-gradient(var(--cyan),var(--cyan)) 0 100%/100% 1px no-repeat,
      repeating-linear-gradient(90deg, var(--cyan) 0 1px,
        transparent 1px calc(var(--seg) - 1px),
        var(--cyan) calc(var(--seg) - 1px) var(--seg),
        transparent var(--seg) calc(var(--seg) + var(--seggap))); }
  .bar.none { background:none; border:1px dotted var(--bevel); }

  /* ── detail card ───────────────────────────────────────────────────────*/
  .card { border:1px solid var(--edge); background:var(--panel);
          padding:10px var(--pad); margin:9px 0; position:relative; }
  /* Corner brackets. The note draws them on the badge to say "this is a
     folded window, not a picture"; here they say the same about a panel — an
     instrument face rather than a box with a border. */
  .card::before, .card::after {
    content:''; position:absolute; width:7px; height:7px;
    border:1px solid var(--bevel); pointer-events:none; }
  .card::before { inset-block-start:-1px; inset-inline-start:-1px;
                  border-inline-end:0; border-block-end:0; }
  .card::after  { inset-block-end:-1px; inset-inline-end:-1px;
                  border-inline-start:0; border-block-start:0; }
  .card h3 { margin:0 0 2px; font-size:14px; font-family:var(--sans);
             font-weight:700; display:flex; align-items:center; gap:8px;
             flex-wrap:wrap; color:var(--ink); }
  .pid { font-family:var(--mono); font-size:10px; color:var(--dim); font-weight:400; }
  .flag { font-size:10px; padding:0 6px; border:1px solid var(--amber);
          color:var(--amber); font-family:var(--mono); }
  .ws { font-family:var(--mono); font-size:10.5px; color:var(--dim);
        margin:5px 0 0; overflow-x:auto; white-space:nowrap; }
  .sess-row { display:flex; align-items:center; gap:9px; padding:6px 0;
              flex-wrap:wrap; border-top:1px solid var(--edge); margin-top:7px; }
  .sess-row:first-of-type { border-top:none; }
  .sess-name { font-family:var(--mono); font-size:11px; min-width:160px;
               color:var(--ink); }
  .chip { font-size:10px; font-family:var(--mono); padding:1px 6px;
          border:1px solid currentColor; white-space:nowrap; letter-spacing:.03em; }
  /* Filled = measured from hooks, hollow = inferred. Same shape so the eye
     compares them, different fill so it can tell them apart at a glance. */
  .chip.unsure { border-style:dashed; opacity:.72; }
  /* Which agent produced a row. Drawn only when it is not the default one:
     a badge on every session would be a column of the same word, and the
     interesting case is the exception. */
  .agent { font-size:9.5px; letter-spacing:.03em; padding:0 4px;
           background:var(--trough); color:var(--dim); margin-right:4px;
           border:1px solid var(--edge); white-space:nowrap;
           font-family:var(--mono); }
  .prec { font-size:10px; margin-right:4px; cursor:default; }
  .prec.hooked { color:var(--phos); }
  .prec.passive { color:var(--dim); }
  .sub { font-size:10px; font-family:var(--mono); margin-left:5px;
         color:var(--dim); border:1px solid var(--edge); padding:0 5px; }

  .prog { display:flex; align-items:center; gap:8px; margin:6px 0 2px;
          flex-wrap:wrap; }
  .phase { font-size:10.5px; font-family:var(--mono); padding:1px 7px;
           border:1px solid var(--edge); background:var(--trough); color:var(--ink); }
  .pct { font-size:11px; font-family:var(--mono); min-width:42px;
         font-variant-numeric:tabular-nums; }
  .prov { font-size:10px; color:var(--dim); }
  .drift { font-size:10px; padding:0 6px; border:1px solid var(--alarm);
           color:var(--alarm); font-family:var(--mono); }
  .noprog { font-size:10px; color:var(--dim); font-style:italic; }

  /* Hue says how loud; dashes say how sure. Stalled and errored are drawn
     dashed because both are inferences about a process that has stopped
     saying anything, and a solid chip would claim more than we know. */
  .s-BUSY { color:var(--phos); }
  .s-WAITING_INPUT { color:var(--amber); }
  .s-WAITING_PERMISSION { color:var(--alarm); }
  .s-STALLED { color:var(--amber); border-style:dashed; }
  .s-ERRORED { color:var(--alarm); border-style:dashed; }
  .s-ORPHANED, .s-ENDED, .s-STARTING, .s-UNKNOWN { color:var(--dim); }

  .ev { font-family:var(--mono); font-size:10px; color:var(--dim);
        flex-basis:100%; opacity:.85; }
  .title { font-size:11.5px; color:var(--ink); opacity:.8; flex:1; min-width:0;
           overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .empty { color:var(--dim); font-style:italic; padding:9px var(--pad); }

  /* ── buttons: the note's square, one-pixel grammar at label width ──────*/
  .backbtn, .boardbtn, .pickbar button {
    background:var(--trough); border:1px solid var(--bevel); color:var(--dim);
    font:inherit; font-family:var(--mono); font-size:10.5px; padding:2px 9px;
    cursor:pointer; letter-spacing:.04em; }
  .backbtn:hover, .boardbtn:hover, .pickbar button:hover {
    color:var(--ink); border-color:var(--cyan); }
  .backbtn { margin:0 0 10px; }
  .boardbtn { margin:2px 0 6px; }

  .board { font-family:var(--mono); font-size:10.5px; color:var(--dim);
           border-inline-start:1px solid var(--edge); padding:5px 0 5px 9px;
           margin:0 0 7px; }
  .board .row { white-space:pre; }
  .board .rung { color:var(--ink); }
  .board .done { color:var(--phos); }
  .board .after { color:var(--amber); }
  .board .note { font-family:var(--sans); font-style:italic; margin-top:4px; }

  /* ── choosing what to follow ───────────────────────────────────────── */
  .pickwrap { margin:9px 0 0; }
  .pick { display:flex; flex-direction:column; gap:0; border:1px solid var(--edge);
          padding:0; background:var(--panel); margin-top:7px; }
  .pick label { display:flex; align-items:center; gap:9px; font-size:11.5px;
                padding:4px var(--pad); cursor:pointer;
                border-block-start:1px solid var(--edge); font-family:var(--mono); }
  .pick label:first-child { border-block-start:0; }
  .pick label:hover { background:var(--trough); }
  .pick .pid { margin-inline-start:auto; }
  .pickbar { display:flex; gap:7px; align-items:center; padding:8px var(--pad);
             border-block-start:1px solid var(--edge); background:var(--trough); }
  .pickbar .msg { font-size:10.5px; color:var(--dim); }

  /* ── which model writes the summary ────────────────────────────────── */
  /* Reuses .pick so the two choosers in this column are visibly the same
     kind of control; only what a provider row has to say beyond its name
     needs rules of its own. */
  .llm .now { padding:7px var(--pad); font-family:var(--mono); font-size:11px;
              display:flex; flex-wrap:wrap; gap:4px 12px; align-items:baseline; }
  .llm .now b { font-weight:600; }
  .llm .out { color:var(--amber); }
  .llm .stay { color:var(--phos); }
  .llm .bad { color:var(--alarm); }
  .llm label { align-items:flex-start; }
  .llm label input { margin-top:2px; }
  .llm .name { min-width:88px; }
  .llm .note { color:var(--dim); font-family:var(--sans); font-size:10.5px;
               margin-inline-start:auto; text-align:end; }
  .llm .group { padding:7px var(--pad) 4px; border-block-start:1px solid var(--edge);
                background:var(--trough); color:var(--dim); font-size:10.5px;
                font-family:var(--sans); }
  /* Three to a row: the name is a word and the mark is two, so a full-width
     line each would be a column of whitespace. */
  .llm label.cli { display:inline-flex; width:calc(33.33% - 1px); box-sizing:border-box;
                   border-block-start:0; vertical-align:top; }
  .llm .fields { display:flex; flex-direction:column; gap:6px;
                 padding:8px var(--pad); border-block-start:1px solid var(--edge); }
  .llm .fields label { display:flex; align-items:center; gap:8px; border:0;
                       padding:0; cursor:auto; }
  .llm .fields span { min-width:88px; color:var(--dim); }
  .llm .fields input { flex:1; min-width:0; background:var(--base); color:var(--ink);
                       border:1px solid var(--bevel); font-family:var(--mono);
                       font-size:11px; padding:3px 6px; }
  .llm .hint { padding:7px var(--pad); border-block-start:1px solid var(--edge);
               color:var(--dim); font-size:10.5px; font-family:var(--sans); }
  .llm .hint code { font-family:var(--mono); color:var(--ink); }

  footer { margin-top:34px; color:var(--dim); font-size:10px;
           border-top:1px solid var(--edge); padding-top:10px;
           font-family:var(--mono); letter-spacing:.02em; }

  /* ── pinned mode ───────────────────────────────────────────────────────
     Same page, same data, less of it. Everything explanatory is dropped
     because the window is two centimetres tall and sits over other work; what
     survives is the answer to "is anything waiting for me".

     This is also the note window on every platform that does not have one.
     The painted WinForms panel is Windows-only and always will be, so on
     macOS and Linux *this* is the sticky note — which is why it is held to the
     same grammar rather than treated as a narrow version of a web page. */
  body[data-mini] { font-size:12px; }
  body[data-mini] .wrap { padding:0; max-width:none; }
  body[data-mini] header, body[data-mini] .meta, body[data-mini] .stats,
  body[data-mini] .caps, body[data-mini] footer, body[data-mini] #warnings,
  body[data-mini] h2, body[data-mini] #waitingWrap,
  body[data-mini] .pickwrap { display:none; }
  body[data-mini] .plist { border:0; }
  /* One column per cell the row actually emits. Declaring four for a
     six-cell row pushed the percentage onto a wrapped second line under the
     project name — which is exactly where it showed up. */
  body[data-mini] .prow {
    grid-template-columns:12px minmax(0,1fr) 68px 60px var(--meter) 38px;
    padding:0 8px; gap:7px; font-size:11.5px; min-height:26px; }
  /* Which cells go, and why these. note.ps1's own row is name, spark,
     waiting, running, meter, percent — it has never had an age column, and at
     360 pixels the meter is worth more than "how long ago". The trace goes
     because the note drops it too once the name would fall under 70px.
     A hidden grid item claims no track, so the template above is shorter by
     exactly this many cells; the panel test counts both and fails if they
     drift apart. */
  body[data-mini] .prow .spark,
  body[data-mini] .prow .xy { display:none; }
  body[data-mini] .prow .why { display:none; }
  body[data-mini] .load { display:none; }
  body[data-mini] .minibar { display:flex; }

  /* The strip is the only chrome left: a drag handle, the one number that
     justifies the window being on top of everything else, and the way back.
     Deliberately the note's own title strip — 26px tall, letter-spaced, amber
     count — so the two read as one window on two operating systems. */
  .minibar { display:none; align-items:center; gap:8px; padding:0 9px;
    min-height:26px; border-bottom:1px solid var(--edge); background:var(--panel);
    font-size:10.5px; font-family:var(--mono); color:var(--dim);
    letter-spacing:.06em; position:sticky; top:0; z-index:10;
    -webkit-app-region:drag; app-region:drag; }
  .minibar b { color:var(--amber); font-variant-numeric:tabular-nums; }
  .minibar .sp { margin-inline-start:auto; -webkit-app-region:no-drag; app-region:no-drag; }
  .minibar a { color:var(--dim); text-decoration:none; border:1px solid var(--bevel);
    padding:0 7px; -webkit-app-region:no-drag; app-region:no-drag; }
  .minibar a:hover { color:var(--ink); border-color:var(--cyan); }

  /* ── narrow ────────────────────────────────────────────────────────────
     The list is a grid of fixed columns and below roughly 640px there is no
     honest way to keep eight of them. The counts and the meter are what the
     page is for; the rest folds away rather than being squeezed into slivers
     too narrow to read. */
  @media (max-width: 640px) {
    .prow { grid-template-columns:12px minmax(0,1fr) 76px 72px var(--meter) 42px; }
    .prow .spark, .prow .xy { display:none; }
    .wrow { flex-wrap:wrap; padding:6px var(--pad); }
    .wrow .sess { min-width:0; }
    .stat b { font-size:18px; }
  }
</style>
</head>
<body>
<div class="minibar" id="minibar">
  <span id="miniCount"></span>
  <span class="sp"></span>
  <a href="#" id="miniFull" data-tr="full view">full view</a>
</div>
<div class="wrap">
  <header>
    <h1>VibeTracker</h1>
    <span class="conn" id="conn" data-tr="connecting…">connecting…</span>
  </header>
  <div class="meta" id="meta"></div>

  <div class="load" id="load"></div>
  <div class="stats" id="stats"></div>
  <div class="caps" id="caps"></div>
  <div id="warnings"></div>

  <div id="waitingWrap" hidden>
    <h2 data-tr="Waiting on you">Waiting on you</h2>
    <div class="waiting" id="waiting"></div>
  </div>

  <div id="listView">
    <h2 data-tr="Projects">Projects</h2>
    <div class="plist" id="projects"></div>
    <div class="pickwrap">
      <button class="backbtn" id="pickToggle" data-tr="choose what to track">choose what to track</button>
      <div class="pick" id="pick" hidden></div>
    </div>
    <div class="pickwrap">
      <button class="backbtn" id="llmToggle" data-tr="LLM summary — which model">LLM summary — which model</button>
      <div class="pick llm" id="llm" hidden></div>
    </div>
  </div>

  <div id="detailView" hidden>
    <button class="backbtn" id="back" data-tr="← all projects">← all projects</button>
    <div id="detail"></div>
  </div>

  <footer>
    <span data-tr="Live — the server pushes; no need to refresh.">Live — the server pushes; no need to refresh.</span>
    <span data-tr="VibeTracker never writes to your projects and never talks to an agent.">VibeTracker never writes to your projects and never talks to an agent.</span>
    <span data-tr="Not affiliated with Anthropic, OpenAI, Google, Microsoft or Cursor.">Not affiliated with Anthropic, OpenAI, Google, Microsoft or Cursor.</span>
  </footer>
</div>

<script>
const TOKEN = '__VT_TOKEN__';

/**
 * Get the token out of the address bar, immediately.
 *
 * A link is the only way to hand a browser a credential, so `vt daemon` prints
 * `?t=<token>` and that is unavoidable. What is avoidable is it *staying*
 * there: the query string becomes the window title, the history entry, the
 * "recently closed" list, and — the reason this got noticed — whatever is in
 * frame when the window is screenshotted or shared. The page already has the
 * token inlined by the server, so the query has done its job before this line
 * runs and nothing below ever reads it.
 *
 * `replaceState` rather than `pushState`: a back button that walks you into a
 * URL carrying the token would undo the whole point. The hash survives,
 * because `#mini` is a view preference and not a secret.
 */
try {
  if (location.search) history.replaceState(null, '', location.pathname + location.hash);
} catch (e) { /* file:// or a locked-down embedder — the page still works */ }

/**
 * Translation, mirroring packages/core/src/i18n.ts: the Turkish source text is
 * the key, and a missing entry falls back to a real sentence rather than to an
 * identifier. The catalog is inlined by the daemon so the page makes no extra
 * request and works when opened from a restart before any scan completes.
 */
const I18N = "__VT_I18N__";
const tr = (s) => (typeof I18N === 'object' && I18N[s]) || s;
function t(strings, ...values) {
  let key = strings[0];
  for (let i = 1; i < strings.length; i++) key += '{' + (i - 1) + '}' + strings[i];
  const template = tr(key);
  return template.replace(/\{(\d+)\}/g, (whole, d) => {
    const v = values[Number(d)];
    return v === undefined ? whole : String(v);
  });
}
/** Phrases from the engine: {key, args}, translated and interpolated here. */
function say(p) {
  if (!p) return '';
  if (typeof p === 'string') return p;
  return tr(p.key).replace(/\{(\d+)\}/g, (whole, d) => {
    const v = p.args[Number(d)];
    if (v === undefined) return whole;
    return (v && typeof v === 'object' && v.key) ? say(v) : String(v);
  });
}
/** Static markup carries its own key in data-tr. */
function translateStatic() {
  for (const el of document.querySelectorAll('[data-tr]')) el.textContent = tr(el.dataset.tr);
}
const CONFIDENT = 0.7;
const GLYPH = { STARTING:'◌', BUSY:'▶', WAITING_PERMISSION:'●', WAITING_INPUT:'⏸',
                STALLED:'⚠', ERRORED:'✖', ENDED:'·', ORPHANED:'×', UNKNOWN:'?' };

// Units must be unambiguous within a language: `9sa 36dk` once rendered as
// `9s 36dk`, which reads as nine seconds. They are looked up rather than
// translated as whole strings — an age appears on nearly every line, and a
// catalog entry per duration would be thousands of keys for four words.
const U = { s: tr('s'), m: tr('m'), h: tr('h'), d: tr('d') };

// Turkish writes the sign first (%99), English last (99%). The number is the
// message here, so the sign has to move around it rather than be a catalog
// entry of its own.
const PCT_FIRST = tr('{0}%') !== '%{0}';
/**
 * The width of a lit run of segments.
 *
 * The meter is ten discrete segments, so a fill of 63% would light six and a
 * third of them — a sliver that reads as a rendering artefact rather than as a
 * number. note.ps1 rounds to a whole segment (`lit = round(pct/100 * segs)`)
 * and so does this, which is also what keeps the two surfaces showing the same
 * picture of the same project.
 */
function segWidth(pct) {
  const clamped = Math.max(0, Math.min(100, pct));
  return Math.round(clamped / 10) * 10;
}

function fmtPercent(v, approximate) {
  const tilde = approximate ? '~' : '';
  return PCT_FIRST ? tilde + v + '%' : tilde + '%' + v;
}

// Mirrors sinceMs() in core: a timestamp slightly in the future is a session
// that wrote while the scan was still running, not a broken clock. Fold it to
// zero; anything further ahead than a scan could explain keeps its '?'.
const FUTURE_TOLERANCE_MS = 90000;
function sinceMs(now, at) {
  const d = now - at;
  return d < 0 && d > -FUTURE_TOLERANCE_MS ? 0 : d;
}

function fmtAge(ms) {
  if (!isFinite(ms) || ms < 0) return '?';
  const s = Math.floor(ms/1000);
  if (s < 60) return s + U.s;
  const m = Math.floor(s/60);
  if (m < 60) return m + U.m + ' ' + (s%60) + U.s;
  const h = Math.floor(m/60);
  if (h < 24) return h + U.h + ' ' + (m%60) + U.m;
  return Math.floor(h/24) + U.d + ' ' + (h%24) + U.h;
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const needsYou = st =>
  st==='WAITING_PERMISSION'||st==='WAITING_INPUT'||st==='STALLED'||st==='ERRORED';
const urgency = st =>
  st==='WAITING_PERMISSION'?3 : (st==='STALLED'||st==='ERRORED')?2 : st==='WAITING_INPUT'?1 : 0;

let report = null;

function chip(s) {
  const unsure = s.confidence < CONFIDENT;
  const tool = s.openTools?.[0] ? ' ' + esc(s.openTools[0]) : '';
  const label = esc(s.state) + (unsure ? '?' : '') + tool;
  const how = s.hooked ? tr('hook (measured)') : tr('passive (inferred)');
  return `<span class="chip s-${esc(s.state)}${unsure?' unsure':''}" title="${tr('confidence')} ${s.confidence.toFixed(2)} · ${how}">${label}</span>`;
}

// A measured state and an inferred one must never look the same. The dot marks
// sessions whose state came from hook events; everything else is our best
// reading of a transcript, and the difference matters most exactly when the
// screen says WAITING_PERMISSION.
/**
 * A session's name.
 *
 * The pid is appended because the agent's own names are not unique -- two
 * sessions in one project were observed sharing `agentworld-43`, one live and
 * one whose pid had been recycled. But Codex and opencode publish no pid at
 * all, and a trailing `·0` would suggest there was something to tell apart.
 */
function sessionName(s) {
  const base = s.name || s.sessionId.slice(0, 8);
  return s.pid > 0 ? base + '·' + s.pid : base;
}

/**
 * The agent badge.
 *
 * Absent for Claude Code, and that asymmetry is deliberate: it is the agent
 * whose reader is the scan itself, the one every other row is compared against,
 * and labelling all of them would turn a signal into wallpaper. What the badge
 * says is "this row came from somewhere else, and here is where".
 */
function agentBadge(s) {
  const kind = s.agentKind;
  if (!kind || kind === 'claude-code') return '';
  return `<span class="agent" title="${tr('the adapter that read this session')}">${esc(kind)}</span>`;
}

function precision(s) {
  return s.hooked
    ? `<span class="prec hooked" title="${tr('state comes from hook events — measured')}">◆</span>`
    : `<span class="prec passive" title="${tr('state inferred from the transcript and process tree — a guess')}">◇</span>`;
}

/**
 * The progress row.
 *
 * Three visual states, never blurred together: a solid bar for a number
 * counted from explicit items, a hatched bar with `~` for one inferred from
 * ladder position, and an empty dashed channel with `—` plus the reason when
 * we refused to produce one. Drawing "we do not know" in the same language as
 * "we counted 8 of 13" is how a dashboard starts lying.
 */
/**
 * The row's phase and percentage — and the ladder they come from.
 *
 * The structural reading always wins. A model's answer is the rung *below*
 * "nothing", never above a counted one: it fills the cell only when the
 * counting engine refused, and when it does it is drawn as an estimate — a
 * dashed bar, a `~`, and the model's name in the tooltip. The plan's rule, in
 * one place, because a surface that quietly promotes a guess to a measurement
 * is worse than one that shows a dash.
 */
function progressRow(p, digest) {
  if (!p && !digest) return '';
  p = p || { phase: null, percent: null, drift: [] };
  const bits = [];
  // Only when the counting engine had nothing to say.
  const guessPhase = !p.phase && digest && digest.phaseLabelRaw ? digest : null;
  const guessPct = (p.percent === null || p.percent === undefined)
    && digest && digest.percentEstimate !== null && digest.percentEstimate !== undefined
    ? digest : null;
  if (p.phase) {
    const total = p.phase.total > p.phase.ordinal ? ' / ' + p.phase.total : '';
    const sub = p.phase.sub ? ' · ' + esc(p.phase.sub) : '';
    bits.push(`<span class="phase" title="${tr('source')}: ${esc(p.phase.basis)}">${esc(p.phase.labelRaw)}${total}${sub}</span>`);
  }
  if (guessPhase) {
    const pos = guessPhase.phaseIndex !== null && guessPhase.phaseTotal
      ? ' ' + guessPhase.phaseIndex + '/' + guessPhase.phaseTotal : '';
    bits.push(`<span class="phase guess" title="${esc(guessPhase.provider + ' · ' + guessPhase.model)}">~${esc(guessPhase.phaseLabelRaw)}${esc(pos)}</span>`);
  }
  if (!p.phase && !guessPhase && p.phaseSuppressed) bits.push(`<span class="noprog">${esc(say(p.phaseSuppressed))}</span>`);
  if (p.percent !== null && p.percent !== undefined) {
    const cls = p.approximate ? 'bar approx' : 'bar';
    bits.push(`<span class="${cls}"><i style="width:${segWidth(p.percent)}%"></i></span>`);
    bits.push(`<span class="pct">${fmtPercent(p.percent, p.approximate)}</span>`);
  } else if (guessPct) {
    // Coarsened to a tenth and marked, because a model's "70" is not a
    // measurement of anything and reading it as one is the failure the whole
    // percentage engine is arranged to avoid.
    bits.push(`<span class="bar guess"><i style="width:${segWidth(guessPct.percentEstimate)}%"></i></span>`);
    bits.push(`<span class="pct guess" title="${esc(guessPct.provider + ' · ' + guessPct.model)}">${fmtPercent(segWidth(guessPct.percentEstimate), true)}</span>`);
  } else {
    bits.push('<span class="bar none"></span><span class="pct">—</span>');
    if (p.percentSuppressed) bits.push(`<span class="noprog">${esc(say(p.percentSuppressed))}</span>`);
  }
  for (const d of p.drift || []) {
    bits.push(`<span class="drift" title="${esc(say(d.evidence))}">${esc(say(d.claim))}</span>`);
  }
  if (p.provenance) bits.push(`<span class="prov">${esc(say(p.provenance))}</span>`);
  const nextText = p.nextAction || (digest && digest.nextAction) || '';
  const fromModel = !p.nextAction && nextText;
  const next = nextText
    ? `<div class="prov${fromModel ? ' guess' : ''}">${t`next: ${esc(nextText.slice(0, 160))}`}</div>` : '';
  return `<div class="prog">${bits.join('')}</div>${next}`;
}

/**
 * What a model said, drawn so it can never be mistaken for what was counted.
 *
 * Everything else on this page is a count or a fact off the disk. This is a
 * reading, produced by a system that can be confidently wrong, and it is the
 * only thing here that cost the user money or quota. So it gets its own frame,
 * it names the model, it carries its own timestamp, and its percentage — if it
 * has one at all — is never drawn in the same bar as a counted one.
 *
 * Absent for almost everybody, which is the intended state.
 */
function digestBlock(d) {
  if (!d) return '';
  const rows = [];
  if (d.phaseLabelRaw) {
    const pos = d.phaseIndex !== null && d.phaseTotal ? ` ${d.phaseIndex}/${d.phaseTotal}` : '';
    rows.push(`<div class="dg-phase">${esc(d.phaseLabelRaw)}${esc(pos)}
      <span class="dg-kind">${esc(d.phaseKind)} · ${esc(d.phaseStatus)}</span></div>`);
  }
  if (d.summary) rows.push(`<div class="dg-sum">${esc(d.summary)}</div>`);
  if (d.percentEstimate !== null && d.percentEstimate !== undefined) {
    rows.push(`<div class="dg-line"><b>${tr('progress')}</b> ${fmtPercent(esc(String(d.percentEstimate)), true)}
      <span class="dg-kind">${esc(d.percentBasis)} · ${esc(d.confidence)}</span></div>`);
  }
  if (d.nextAction) rows.push(`<div class="dg-line"><b>${tr('next')}</b> ${esc(d.nextAction)}</div>`);
  if (d.blocker) rows.push(`<div class="dg-line dg-bad"><b>${tr('blocker')}</b> ${esc(d.blocker)}</div>`);
  if (d.stallReason) rows.push(`<div class="dg-line"><b>${tr('stalled')}</b> ${esc(d.stallReason)}</div>`);
  for (const c of d.conflicts || []) rows.push(`<div class="dg-line dg-warn">${esc(c)}</div>`);
  for (const r of d.riskFlags || []) rows.push(`<div class="dg-line dg-warn">${esc(r)}</div>`);
  const ev = (d.evidence || []).map(e => `${e.kind}: ${e.ref}`).join(' · ');
  return `<div class="digest">
    <div class="dg-head">${tr('LLM summary')}
      <span class="dg-kind">${esc(d.provider)}${d.model ? ' · ' + esc(d.model) : ''} · ${esc(fmtAge(Date.now() - d.atMs))}</span></div>
    ${rows.join('')}
    ${ev ? `<div class="dg-ev" title="${esc(ev)}">${tr('evidence')}: ${esc(ev.slice(0, 200))}</div>` : ''}
  </div>`;
}

function subagentBadge(s) {
  return s.subagents ? `<span class="sub" title="${tr('running subagents')}">⑂${s.subagents}</span>` : '';
}

// Dwell is measured from when the state began, not from the last transcript
// write — that is the number a human actually wants ("waiting 41 minutes").
function dwellOf(s, now) {
  const from = s.stateSince ?? s.lastActivityAt;
  return from ? fmtAge(sinceMs(now, from)) : '—';
}

function render() {
  if (!report) return;
  const now = Date.now();
  const c = report.counts;

  document.getElementById('meta').textContent =
    new Date(report.generatedAt).toLocaleTimeString() + ' · ' + report.platform +
    ' · ' + report.probeKind + ' (' + report.probePrecision + ') · ' + report.claudeDir;

  renderLoad();

  document.getElementById('stats').innerHTML = [
    [tr('live sessions'), c.live, false],
    [tr('records'), c.registryEntries, false],
    [tr('dead'), c.dead, false],
    [tr('PID reuse'), c.reused, c.reused > 0],
    ['proje', c.projects, false],
    ['seni bekliyor', c.needsYou, c.needsYou > 0],
    ['IDE penceresi', c.ideWindows, false],
  ].map(([label, v, alert]) =>
    `<div class="stat${alert?' alert':''}"><b>${v}</b><span>${label}</span></div>`).join('');

  document.getElementById('caps').innerHTML = Object.entries(report.capabilities)
    .map(([k,v]) => `<span class="cap ${v.ok?'ok':'bad'}" title="${esc(v.detail||'')}">${v.ok?'✓':'!'} ${esc(k)}</span>`)
    .join('');

  document.getElementById('warnings').innerHTML =
    report.warnings.map(w => `<div class="warn">${esc(w)}</div>`).join('');

  const waiting = [];
  for (const p of report.projects)
    for (const s of p.sessions)
      if (needsYou(s.state)) waiting.push({p, s});
  waiting.sort((a,b) => urgency(b.s.state)-urgency(a.s.state) ||
    (a.s.stateSince??a.s.lastActivityAt??0)-(b.s.stateSince??b.s.lastActivityAt??0));

  document.getElementById('waitingWrap').hidden = waiting.length === 0;
  document.getElementById('waiting').innerHTML = waiting.map(({p,s}) => `
    <div class="wrow u${urgency(s.state)}">
      <span>${GLYPH[s.state]||'?'}</span>
      <span class="proj">${esc(p.displayName)}</span>
      <span class="sess">${esc(sessionName(s))}</span>
      ${agentBadge(s)}${precision(s)}${chip(s)}${subagentBadge(s)}
      <span class="grow">${esc(s.title || s.lastPrompt || '')}</span>
      <span class="dwell" data-since="${s.stateSince ?? s.lastActivityAt ?? ''}">${dwellOf(s, now)}</span>
    </div>`).join('');

  renderList();
  if (view === 'detail') renderDetail();
  renderMinibar();
}

/**
 * Which projects the user follows, and which project is open.
 *
 * `view` lives in the URL hash so the pinned window can be launched straight
 * into mini mode, and so a reload does not throw away what you were looking
 * at. Nothing here is stored on the server: it is a viewing preference, and
 * the daemon has no business remembering it.
 */
let view = 'list';
let openProject = null;
const MINI = location.hash.includes('mini');
if (MINI) document.body.setAttribute('data-mini', '');

function followed() {
  return report ? report.projects.filter(p => p.tracked) : [];
}

/**
 * The row summary comes from the engine, already computed.
 *
 * It used to be worked out here as well, which meant the same question had
 * two answers written in two languages. They agreed today; the second time
 * one of them changed they would not have, and a dashboard that disagrees
 * with the terminal about the same project destroys trust in both.
 */
function summarize(p) {
  return p.summary || { kind: 'none', waiting: 0, running: 0, live: 0, total: 0, urgency: 0 };
}

function rank(p) {
  const a = summarize(p);
  if (a.kind === 'waiting') return 1000 + a.urgency * 10 + Math.min(a.waiting, 9);
  if (a.kind === 'running') return 500 + Math.min(a.running, 9);
  if (a.kind === 'idle') return 100;
  return 0;
}

/**
 * Waiting and running, always both, in two fixed cells.
 *
 * See `agentCell` in the terminal renderer for why: naming one state hid the
 * other, and the `live/total` pair beside it read as "running/total" while
 * meaning something else entirely.
 */
function waitingText(a) {
  return a.waiting > 0 ? t`${a.waiting} waiting` : '—';
}

function runningText(a) {
  if (a.running > 0) return t`${a.running} running`;
  if (a.waiting === 0) return a.live > 0 ? tr('idle') : tr('off');
  return '—';
}

/**
 * The last twenty-four minutes as a line, or nothing.
 *
 * `-1` marks a minute before this project was being watched, and it breaks
 * the line instead of grounding it. A daemon that restarted an hour ago would
 * otherwise show every project sitting flat at zero for the hour before it —
 * a claim about a period nobody observed.
 */
function sparkline(m) {
  if (!Array.isArray(m) || m.length < 2) {
    // Nothing recorded at all: a flat dotted rule, which says that and not
    // "this project did nothing".
    return '<svg class="spark" viewBox="0 0 54 16" preserveAspectRatio="none" aria-hidden="true">' +
      '<path class="flat" d="M0 15 H54"/></svg>';
  }
  const max = Math.max(1, ...m);
  const step = 54 / (m.length - 1);
  let d = '';
  let pen = false;
  let segments = 0;
  let last = null;
  for (let i = 0; i < m.length; i++) {
    if (m[i] < 0) { pen = false; continue; }
    const x = (i * step).toFixed(1);
    const y = (15 - 13 * (m[i] / max)).toFixed(1);
    d += (pen ? 'L' : 'M') + x + ' ' + y + ' ';
    if (pen) segments++;
    pen = true;
    last = [Number(x), Number(y)];
  }
  // One observed minute is a line with no length, and a line with no length
  // draws nothing -- which looks exactly like "no data" for the first minute
  // after every daemon restart. A tick mark says the difference.
  if (segments === 0 && last) d = `M${(last[0] - 2).toFixed(1)} ${last[1]} L${last[0]} ${last[1]}`;
  // The axis is always the full twenty-four minutes, so two rows can be
  // compared -- a trace whose span changed with how much history it happened
  // to have would be unreadable. The unwatched minutes get the dotted rule,
  // the same thing the progress bar draws for "nobody measured this".
  const first = m.findIndex((v) => v >= 0);
  const gap = first > 0
    ? `<path class="flat" d="M0 15 H${(Math.min(first, m.length - 1) * step).toFixed(1)}"/>`
    : '';
  return `<svg class="spark" viewBox="0 0 54 16" preserveAspectRatio="none" aria-hidden="true">${gap}<path d="${d.trim()}"/></svg>`;
}

/**
 * Fleet load, rendered from the engine's own figure.
 *
 * Nothing alive is a dash and an empty dotted channel, not a zero-length bar:
 * the same grammar the progress meters use for "nobody measured this".
 */
function renderLoad() {
  const el = document.getElementById('load');
  const l = report && report.load;
  if (!l) { el.innerHTML = ''; return; }
  const label = tr('system load');
  if (l.percent == null || l.live === 0) {
    el.innerHTML = `<span>${label}</span><span class="track none"></span><span class="pc">—</span>`;
    return;
  }
  const run = Math.round(100 * Math.min(l.running, l.live) / l.live);
  const wait = Math.min(100 - run, Math.round(100 * Math.min(l.waiting, l.live) / l.live));
  el.innerHTML = `<span>${label}</span><span class="track">` +
    `<i class="run" style="width:${run}%"></i><i class="wait" style="width:${wait}%"></i>` +
    `</span><span class="pc">${fmtPercent(Math.round(l.percent), false)}</span>`;
}

/** The same bar the detailed card draws, at list scale. */
/**
 * The row's meter. Counted first, a model's reading only when nothing counted.
 *
 * Three states, three drawings, and they have to stay distinguishable at a
 * glance from two metres away: solid segments for a count, outlined segments
 * for a coarse one, hatched amber for a model's estimate, and a dotted empty
 * channel for "no honest number". A meter that drew a guess the way it draws a
 * count would make the whole row lie quietly.
 */
function miniBar(pr, digest) {
  if (pr && pr.percent != null) {
    const cls = pr.approximate ? 'bar approx' : 'bar';
    return `<span class="${cls}"><i style="width:${segWidth(pr.percent)}%"></i></span>`;
  }
  if (digest && digest.percentEstimate != null) {
    return `<span class="bar guess"><i style="width:${segWidth(digest.percentEstimate)}%"></i></span>`;
  }
  return '<span class="bar none"></span>';
}

function renderList() {
  const list = followed();
  const el = document.getElementById('projects');
  if (list.length === 0) {
    el.innerHTML = `<div class="prow"><span></span><span class="nm">${
      report && report.counts.untracked > 0
        ? tr('No projects tracked — choose below.')
        : tr('No sessions visible. Start an agent session.')}</span></div>`;
    return;
  }
  const now = Date.now();
  el.innerHTML = list.slice().sort((a, b) => rank(b) - rank(a)).map(p => {
    const a = summarize(p);
    const glyph = a.kind === 'waiting' ? (a.urgency >= 3 ? '●' : '⏸')
                : a.kind === 'running' ? '▶' : '·';
    const dwell = a.leadSince ? fmtAge(sinceMs(now, a.leadSince)) : '';
    const counted = p.progress && p.progress.percent != null;
    const guessed = !counted && p.digest && p.digest.percentEstimate != null;
    const pct = counted
      ? fmtPercent(p.progress.percent, p.progress.approximate)
      : guessed ? '~%' + segWidth(p.digest.percentEstimate) : '—';
    const why = !MINI && a.leadTitle ? `<span class="why">${esc(a.leadTitle)}</span>` : '';
    return `<button class="prow ${a.kind} u${a.urgency}" data-open="${esc(p.projectId)}">
      <span>${glyph}</span>
      <span class="nm">${esc(p.displayName)}</span>
      ${sparkline(p.momentum)}
      <span class="ag wait${a.waiting > 0 ? '' : ' off'}">${esc(waitingText(a))}</span>
      <span class="ag run${a.running > 0 ? '' : ' off'}">${esc(runningText(a))}</span>
      <span class="xy" data-since="${a.leadSince ?? ''}">${esc(dwell)}</span>
      ${miniBar(p.progress, p.digest)}
      <span class="pc${guessed ? ' guess' : ''}"${guessed ? ` title="${esc(p.digest.provider + ' · ' + p.digest.model)}"` : ''}>${esc(pct)}</span>
      ${why}
    </button>`;
  }).join('');
}

/** The full card, unchanged in content — only in when you see it. */
function projectCard(p) {
  const now = Date.now();
  return `
    <div class="card">
      <h3>${esc(p.displayName)}
        <span class="pid">${esc(p.projectId)}${p.identityKind !== 'git_root' ? ' · ' + esc(p.identityKind) : ''}</span>
        ${p.flags.map(f => `<span class="flag">${esc(flagText(f))}</span>`).join('')}
      </h3>
      ${progressRow(p.progress, p.digest)}
      ${digestBlock(p.digest)}
      <button class="boardbtn" data-project="${esc(p.projectId)}">${tr('phase board')}</button>
      <div class="board" id="board-${esc(p.projectId)}" hidden></div>
      ${p.workspaces.map(w => {
        const bits = [];
        if (w.branch) bits.push(w.branch);
        if (w.commitCount != null) bits.push(w.commitCount === 1 ? t`${w.commitCount} commit` : t`${w.commitCount} commits`);
        if (w.dirtyCount != null) bits.push(t`${w.dirtyCount} dirty`);
        if (w.isWorktree) bits.push('worktree');
        if (w.storageKind !== 'local') bits.push(w.storageKind);
        const lbl = p.workspaces.length > 1 && w.label ? '<b>' + esc(w.label) + '</b> · ' : '';
        return `<div class="ws">${lbl}${esc(w.normPath)}${bits.length ? ' — ' + esc(bits.join(' · ')) : ''}</div>`;
      }).join('')}
      ${p.sessions.map(sv => `
        <div class="sess-row">
          <span>${GLYPH[sv.state] || '?'}</span>
          <span class="sess-name">${esc(sessionName(sv))}</span>
          ${agentBadge(sv)}${precision(sv)}${chip(sv)}${subagentBadge(sv)}
          <span class="title">${esc(sv.title || '')}</span>
          <span class="dwell" data-since="${sv.stateSince ?? sv.lastActivityAt ?? ''}">${dwellOf(sv, now)}</span>
          <span class="ev">${esc((sv.evidence || []).join(' · '))}</span>
        </div>`).join('')}
    </div>`;
}

function renderDetail() {
  const p = report && report.projects.find(x => x.projectId === openProject);
  const el = document.getElementById('detail');
  if (!p) {
    // The project vanished between clicking and rendering — its last session
    // ended, or it was just untracked. Saying so beats an empty pane.
    el.innerHTML = `<p class="empty">${tr('This project is no longer visible.')}</p>`;
    return;
  }
  el.innerHTML = projectCard(p);
}

function setView(next, projectId) {
  view = next;
  openProject = projectId ?? openProject;
  document.getElementById('listView').hidden = next !== 'list';
  document.getElementById('detailView').hidden = next !== 'detail';
  if (next === 'detail') renderDetail();
}

/** The pinned strip: one number, and a way back to the full page. */
function renderMinibar() {
  if (!MINI || !report) return;
  const n = report.counts.needsYou;
  document.getElementById('miniCount').innerHTML = n > 0
    ? `<b>${n}</b> ${esc(tr('waiting'))}`
    : esc(tr('nothing waiting'));
}

// ── choosing what to follow ─────────────────────────────────────────────
// The same decision `vt projects` makes, from the window you are already
// looking at: needing a terminal to hide a project defeats a pinned panel.
let picking = false;

/**
 * Candidates come from the daemon, not from the board.
 *
 * The board only ever holds projects with something running, so a chooser
 * built from it could offer you only what happened to be live at that moment —
 * and the project you want to add is usually the one you just closed. The
 * daemon answers from what it has ever seen, and it decides `tracked` itself
 * because that depends on the tracking *mode*, which the board does not carry.
 */
let candidates = null;
/** Whether the list we are showing is known to be less than all of them. */
let candidatesPartial = false;

async function loadCandidates() {
  try {
    const res = await fetch('/api/v1/candidates?t=' + encodeURIComponent(TOKEN), {
      headers: { 'X-VT-Token': TOKEN },
    });
    if (!res.ok) throw new Error(String(res.status));
    const body = await res.json();
    candidates = body.candidates || [];
    candidatesPartial = !!body.truncated;
  } catch (e) {
    // Fall back to the board rather than to an empty list: a partial chooser
    // still works, an empty one looks broken.
    candidates = (report ? report.projects : []).map(p => ({
      projectId: p.projectId, displayName: p.displayName, tracked: p.tracked,
    }));
    candidatesPartial = true;
  }
  renderPick();
}

function renderPick() {
  const el = document.getElementById('pick');
  el.hidden = !picking;
  if (!picking) return;
  if (!candidates) { el.innerHTML = `<div class="pickbar">${tr('loading…')}</div>`; return; }
  el.innerHTML = candidates.map(p => `
    <label>
      <input type="checkbox" data-track="${esc(p.projectId)}" ${p.tracked ? 'checked' : ''}>
      <span>${esc(p.displayName)}</span>
      <span class="pid">${esc(p.projectId)}</span>
    </label>`).join('') + `
    <div class="pickbar">
      <button id="pickSave">${tr('save')}</button>
      <button id="pickAll">${tr('all')}</button>
      <span class="msg" id="pickMsg">${
        candidatesPartial ? esc(tr('list is not complete — only what you change here is written')) : ''
      }</span>
    </div>`;
}

/**
 * What the chooser is asking to change, as a change.
 *
 * The save used to send the ticked boxes as the whole truth — `{mode,
 * selected}` — and that form is only correct for a client showing every
 * project there is. This one never is. The list is capped at
 * `CANDIDATE_LIMIT`, and when the fetch fails it falls back to the board,
 * which is smaller still. So saving quietly unfollowed every project that had
 * not happened to be on screen, and nothing on screen said so. The daemon has
 * carried a comment warning about exactly this above `/api/v1/tracking` since
 * it was written; the page was simply using the wrong one of the two forms it
 * offers.
 *
 * Comparing against what was loaded rather than against the board is what
 * makes the delta narrow: a box nobody touched contributes nothing, whichever
 * way it is set.
 */
function pickDelta() {
  const boxes = [...document.querySelectorAll('#pick input[data-track]')];
  const was = new Map((candidates || []).map(p => [p.projectId, !!p.tracked]));
  return {
    add: boxes.filter(i => i.checked && !was.get(i.dataset.track)).map(i => i.dataset.track),
    remove: boxes.filter(i => !i.checked && was.get(i.dataset.track)).map(i => i.dataset.track),
  };
}

async function saveTracking(body) {
  const msg = document.getElementById('pickMsg');
  if (msg) msg.textContent = tr('saving…');
  try {
    const res = await fetch('/api/v1/tracking?t=' + encodeURIComponent(TOKEN), {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'X-VT-Token': TOKEN },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error(String(res.status));
    // The daemon notices the config change on its next scan; the board
    // updates itself from the next push rather than from a guess made here.
    // The chooser's own ticks are the exception: they are what the *next*
    // delta is computed against, so leaving them stale would make a second
    // save re-send a change that has already been applied.
    if (candidates) {
      const on = new Set(body.add || []);
      const off = new Set(body.remove || []);
      for (const p of candidates) {
        if (on.has(p.projectId)) p.tracked = true;
        if (off.has(p.projectId)) p.tracked = false;
        if (body.mode === 'all') p.tracked = true;
      }
    }
    if (msg) msg.textContent = tr('saved');
  } catch (e) {
    if (msg) msg.textContent = tr('could not save');
  }
}

// ── which model writes the summary ──────────────────────────────────────
// The same decision `vt digest providers` reports, made from the window
// instead of from a text editor. It was previously reachable only by finding
// a TOML file, which meant in practice that it stayed at its default — and
// the default is off.
//
// Two things this panel will not do, both deliberate and both explained where
// they are enforced (engine/src/digest/select.ts, daemon/src/digest-settings.ts):
// it cannot set the provider that runs a command of your choosing, and it
// never touches the API key. The key box here holds the *name* of an
// environment variable; the key itself goes in with `vt digest key`.
let llmOpen = false;
/** The daemon's answer, or null before the first load. */
let llm = null;
/** The provider the radio buttons are on — not yet what the file says. */
let llmPick = null;
/** Typed-but-unsaved text, so a re-render does not eat what you are writing. */
let llmDraft = { model: '', base_url: '', api_key_env: '' };

/**
 * Name and one line of why, per option.
 *
 * The four that are not agent CLIs get their own sentence. The rest are named
 * by their program — `crush`, `droid`, `aider` are proper nouns, so there is
 * nothing to translate per row and adding one to the engine's table reaches
 * this list without a second edit or a new catalog key.
 */
function llmLabel(o) {
  const id = o.id;
  if (id === 'off') return [tr('Off'), tr('the structural engine works on its own; nothing is sent')];
  if (id === 'ollama') return [tr('Ollama'), tr('a model on this machine; needs no key, nothing leaves')];
  if (id === 'openai') return [tr('OpenAI-compatible'), tr('one base_url reaches OpenRouter, Groq, DeepSeek, Mistral, xAI, LM Studio, vLLM…')];
  if (id === 'anthropic') return [tr('the Anthropic API'), tr('a key is required')];
  // The agent CLIs never reach here: they are rendered under their own
  // heading, by program name, because the only thing that differs between
  // them is whether the program is on this machine.
  return [o.program || id, ''];
}

/** The egress sentence, in the three words that matter. Mirrors `vt digest`. */
function llmEgress(e) {
  if (e === 'no') return `<span class="stay">${esc(tr('data does not leave this machine'))}</span>`;
  if (e === 'yes') return `<span class="out">${esc(tr('data DOES leave this machine'))}</span>`;
  return `<span class="out">${esc(tr('does data leave — unknown'))}</span>`;
}

async function loadLlm() {
  try {
    const res = await fetch('/api/v1/digest?t=' + encodeURIComponent(TOKEN), {
      headers: { 'X-VT-Token': TOKEN },
    });
    if (!res.ok) throw new Error(String(res.status));
    llm = await res.json();
    llmPick = llm.provider;
    llmDraft = { model: llm.model, base_url: llm.baseUrl, api_key_env: llm.keyEnv };
  } catch (e) {
    llm = 'error';
  }
  renderLlm();
}

/** The option object for whatever the radios are on, or null while on `cli`. */
function llmPicked() {
  if (!llm || llm === 'error') return null;
  return llm.options.find(o => o.id === llmPick) || null;
}

function renderLlm() {
  const el = document.getElementById('llm');
  el.hidden = !llmOpen;
  if (!llmOpen) return;
  if (!llm) { el.innerHTML = `<div class="pickbar">${esc(tr('loading…'))}</div>`; return; }
  if (llm === 'error') { el.innerHTML = `<div class="pickbar">${esc(tr('could not be read'))}</div>`; return; }

  // What the file says right now, before any of the radios below.
  const now = [`<b>${esc(llm.provider)}</b>`];
  if (llm.provider !== 'off') {
    if (llm.modelEffective) now.push(esc(llm.modelEffective));
    if (llm.baseUrlEffective) now.push(esc(llm.baseUrlEffective));
    if (llm.commandLine) now.push(esc(llm.commandLine));
    now.push(llmEgress(llm.egress));
    now.push(llm.ready
      ? `<span class="stay">${esc(tr('ready'))}</span>`
      : `<span class="bad">${esc(tr('incomplete configuration'))}</span>`);
  } else {
    now.push(esc(tr('every number on the board is computed on this machine')));
  }
  // Each fact is its own flex child, so the row's gap separates them. Joined
  // raw, `openai` and its address ran together into one unreadable word.
  let html = `<div class="now">${now.map(x => `<span>${x}</span>`).join('')}</div>`;

  // A configured `cli` is state, not an option — it cannot be ticked because
  // this panel will not write a command. Saying so beats a row that silently
  // refuses.
  if (!llm.inOptions) {
    html += `<div class="hint">${esc(tr('The option that runs a command of your own is set from the config file only. You can still switch to another provider below.'))}</div>`;
  }

  const radio = o => `<input type="radio" name="llmp" value="${esc(o.id)}" ${o.id === llmPick ? 'checked' : ''}>`;
  const installed = o => o.installed === true
    ? `<span class="stay">${esc(tr('installed'))}</span>`
    : o.installed === false ? `<span class="bad">${esc(tr('not installed'))}</span>` : '';

  // The four that are not agent CLIs, each with its own sentence.
  html += llm.options.filter(o => !o.program || o.id === 'ollama').map(o => {
    const [name, why] = llmLabel(o);
    return `<label>${radio(o)}
      <span class="name">${esc(name)}</span>
      <span>${esc(why)}</span>
      <span class="note">${installed(o)}</span>
    </label>`;
  }).join('');

  // The agent CLIs under one heading. What differs between them is only
  // whether the program is on this machine, so repeating the same sentence
  // thirteen times was thirteen lines saying nothing — the sentence is said
  // once and the rows carry the name and the mark.
  const clis = llm.options.filter(o => o.program && o.id !== 'ollama');
  if (clis.length) {
    html += `<div class="group">${esc(tr('An agent CLI you are already signed in to — needs no key, eats your own account quota'))}</div>`;
    html += clis.map(o => `<label class="cli">${radio(o)}
      <span class="name">${esc(o.program)}</span>
      <span class="note">${installed(o)}</span>
    </label>`).join('');
  }

  const picked = llmPicked();
  if (picked && picked.id !== 'off') {
    const rows = [];
    rows.push(`<label><span>${esc(tr('model'))}</span><input id="llmModel" value="${esc(llmDraft.model)}" placeholder="${esc(picked.modelDefault)}" spellcheck="false"></label>`);
    if (picked.baseUrlDefault) {
      rows.push(`<label><span>${esc(tr('address'))}</span><input id="llmBase" value="${esc(llmDraft.base_url)}" placeholder="${esc(picked.baseUrlDefault)}" spellcheck="false"></label>`);
    }
    if (picked.needsKey) {
      rows.push(`<label><span>${esc(tr('key variable'))}</span><input id="llmKeyEnv" value="${esc(llmDraft.api_key_env)}" placeholder="${esc(picked.keyEnvDefault || '')}" spellcheck="false" autocomplete="off"></label>`);
    }
    html += `<div class="fields">${rows.join('')}</div>`;

    // The key itself, and why it is not a box on this page.
    if (picked.needsKey) {
      const have = llm.provider === picked.id && llm.key.present;
      const where = llm.key.from === 'env' ? (llm.key.envName || '') : llm.keyFile;
      html += `<div class="hint">${
        have
          ? esc(t`Key present: ${llm.key.masked} · ${where}`)
          : esc(tr('The key itself is never written here — this file is backed up and goes into the diagnostic bundle.')) +
            ' <code>vt digest key &lt;anahtar&gt;</code>'
      }</div>`;
    }
  }

  html += `<div class="pickbar">
    <button id="llmSave">${esc(tr('save'))}</button>
    <span class="msg" id="llmMsg"></span>
  </div>`;
  el.innerHTML = html;
}

async function saveLlm() {
  const msg = document.getElementById('llmMsg');
  const value = id => { const box = document.getElementById(id); return box ? box.value.trim() : ''; };
  const body = {
    provider: llmPick,
    model: value('llmModel'),
    base_url: value('llmBase'),
    api_key_env: value('llmKeyEnv'),
  };
  if (msg) msg.textContent = tr('saving…');
  try {
    const res = await fetch('/api/v1/digest?t=' + encodeURIComponent(TOKEN), {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'X-VT-Token': TOKEN },
      body: JSON.stringify(body),
    });
    const answer = await res.json();
    if (!res.ok) {
      // The daemon's sentence, not a generic failure: it is the one that knows
      // which of the four fields was wrong and why.
      if (msg) msg.textContent = answer.error || tr('could not save');
      return;
    }
    // Re-read from the answer rather than from what was typed: the daemon
    // clears a default address and drops a conventional variable name, and a
    // panel still showing the typed version would disagree with the file.
    llm = answer;
    llmPick = llm.provider;
    llmDraft = { model: llm.model, base_url: llm.baseUrl, api_key_env: llm.keyEnv };
    renderLlm();
    const after = document.getElementById('llmMsg');
    if (after) after.textContent = tr('saved');
  } catch (e) {
    if (msg) msg.textContent = tr('could not save');
  }
}

// Typing is kept out of the render path: re-rendering on every keystroke
// would move the caret, and the draft is what a later render reads back.
document.addEventListener('input', (e) => {
  const box = e.target;
  if (!box || !box.id) return;
  if (box.id === 'llmModel') llmDraft.model = box.value;
  else if (box.id === 'llmBase') llmDraft.base_url = box.value;
  else if (box.id === 'llmKeyEnv') llmDraft.api_key_env = box.value;
});

document.addEventListener('change', (e) => {
  const box = e.target;
  if (!box || box.name !== 'llmp') return;
  llmPick = box.value;
  // Seeded from the file when the radios come back to what is configured, and
  // cleared otherwise: carrying an Ollama address over to Anthropic would
  // offer to save a setting that provider does not have.
  llmDraft = llm && llm !== 'error' && llmPick === llm.provider
    ? { model: llm.model, base_url: llm.baseUrl, api_key_env: llm.keyEnv }
    : { model: '', base_url: '', api_key_env: '' };
  renderLlm();
});

document.addEventListener('click', (e) => {
  const row = e.target.closest && e.target.closest('.prow[data-open]');
  if (row) { setView('detail', row.dataset.open); return; }
  const back = e.target.closest && e.target.closest('#back');
  if (back) { setView('list'); return; }
  const toggle = e.target.closest && e.target.closest('#pickToggle');
  if (toggle) {
    picking = !picking;
    if (picking) { candidates = null; void loadCandidates(); }
    renderPick();
    return;
  }
  const llmBtn = e.target.closest && e.target.closest('#llmToggle');
  if (llmBtn) {
    llmOpen = !llmOpen;
    // Re-read on every open rather than once: `vt init`, `vt digest key` and a
    // hand edit all change this file while the page is sitting there, and a
    // panel showing a stale provider is worse than one that takes a moment.
    if (llmOpen) { llm = null; void loadLlm(); }
    renderLlm();
    return;
  }
  const llmSave = e.target.closest && e.target.closest('#llmSave');
  if (llmSave) { void saveLlm(); return; }
  const all = e.target.closest && e.target.closest('#pickAll');
  if (all) { void saveTracking({ mode: 'all', selected: [] }); return; }
  const save = e.target.closest && e.target.closest('#pickSave');
  if (save) {
    const delta = pickDelta();
    if (!delta.add.length && !delta.remove.length) {
      const msg = document.getElementById('pickMsg');
      if (msg) msg.textContent = tr('nothing changed');
      return;
    }
    void saveTracking(delta);
    return;
  }
  const full = e.target.closest && e.target.closest('#miniFull');
  if (full) {
    e.preventDefault();
    // Leaving mini is a reload, because `MINI` is decided once at load. The
    // token has to travel in the query for exactly that one navigation --
    // carrying `location.search` forward stopped working the moment the page
    // started stripping it, and the reload would have arrived unauthenticated.
    // The page it lands on strips it again, so it is in the address bar for
    // about as long as it was when you first opened the link.
    location.href = location.pathname + '?t=' + encodeURIComponent(TOKEN);
  }
});

/**
 * Advance the clocks without rebuilding the page.
 *
 * The only thing that changes between server pushes is how long something has
 * been waiting, and this used to call the whole of `render()` once a second —
 * which reassigns `innerHTML` for the counters, the waiting strip and the
 * project list. Every rebuild dropped keyboard focus, cleared any text
 * selection and closed whatever was open, once a second, forever: a chooser
 * you could not tab through and a session id you could not select.
 *
 * So the tick writes text into the nodes that hold an elapsed time and touches
 * nothing else. The full rebuild belongs to the SSE frame, which is the only
 * moment the numbers actually changed.
 */
function tickClocks() {
  if (!report) return;
  const now = Date.now();
  for (const el of document.querySelectorAll('[data-since]')) {
    const from = Number(el.dataset.since);
    if (!from) continue;
    const next = fmtAge(sinceMs(now, from));
    // Assigning an identical string still invalidates a selection in some
    // engines, so it is compared first.
    if (el.textContent !== next) el.textContent = next;
  }
}

setInterval(tickClocks, 1000);

function setConn(cls, text) {
  const el = document.getElementById('conn');
  el.className = 'conn ' + cls;
  el.textContent = text;
}

function connect() {
  const es = new EventSource('/api/v1/stream?t=' + encodeURIComponent(TOKEN));
  es.addEventListener('open', () => setConn('live', tr('live')));
  es.addEventListener('overview', e => {
    report = JSON.parse(e.data);
    setConn('live', tr('live'));
    render();
  });
  es.addEventListener('alert', e => {
    const c = JSON.parse(e.data);
    notify(c);
  });
  // EventSource reconnects on its own and replays via Last-Event-ID; we only
  // need to reflect the outage in the UI.
  es.addEventListener('error', () => setConn('down', tr('connection lost — retrying')));
}
/**
 * Phase board, on demand.
 *
 * Not loaded with the overview: it shells out to `git log` per project, and
 * paying that on every three-second tick to render something nobody opened
 * would be the most expensive thing in the loop. One click, one fetch, cached
 * until the page reloads.
 */
const boardCache = new Map();
const BOARD_WIDTH = 40;

async function toggleBoard(projectId) {
  const el = document.getElementById('board-' + projectId);
  if (!el) return;
  if (!el.hidden) { el.hidden = true; return; }
  el.hidden = false;
  if (boardCache.has(projectId)) { el.innerHTML = boardCache.get(projectId); return; }
  el.textContent = tr('loading…');
  try {
    const res = await fetch('/api/v1/board?project=' + encodeURIComponent(projectId) +
      '&t=' + encodeURIComponent(TOKEN));
    const data = await res.json();
    const html = renderBoard(data);
    boardCache.set(projectId, html);
    el.innerHTML = html;
  } catch (e) {
    el.textContent = tr('the phase board could not be read');
  }
}

function renderBoard(b) {
  const spans = (b && b.reconstructed && b.reconstructed.spans) || [];
  if (spans.length === 0) {
    const why = b && b.reconstructed && b.reconstructed.reason === 'no-git'
      ? tr('no git — no recoverable history')
      : tr('no phase name in any commit subject');
    return `<div class="note">${esc(why)}</div>`;
  }
  const min = Math.min(...spans.map(s => s.firstAt));
  const max = Math.max(...spans.map(s => s.lastAt));
  const width = Math.max(1, max - min);
  const at = ms => Math.max(0, Math.min(BOARD_WIDTH - 1,
    Math.round(((ms - min) / width) * (BOARD_WIDTH - 1))));

  const rows = spans.map(s => {
    const a = at(s.firstAt), z = at(s.lastAt), d = s.doneAt == null ? -1 : at(s.doneAt);
    let bar = '';
    for (let i = 0; i < BOARD_WIDTH; i++) {
      if (i === d) bar += '\u2590';
      else if (i === a && a === z) bar += '\u2502';
      else if (i >= a && i <= z) bar += '\u2592';
      else bar += '\u00b7';
    }
    const tail = s.afterDone > 0
      ? `<span class="after">${esc(t` · ${s.afterDone} commits after it was called done`)}</span>`
      : s.doneAt != null
        ? `<span class="done">${esc(t` · finished ${fmtAge(Date.now() - s.doneAt)} ago`)}</span>`
        : `<span>${esc(tr(' · open'))}</span>`;
    const label = (s.unit + ' ' + s.ordinal).padEnd(10);
    return `<div class="row"><span class="rung">${esc(label)}</span>${esc(bar)} ${tail}</div>`;
  }).join('');

  // The seam is stated rather than smoothed over: everything left of it is a
  // reconstruction, everything right of it was watched.
  const note = b.seam
    ? t`▲ measured from ${new Date(b.seam).toISOString().slice(0, 10)} onward; everything before is mined from commit subjects.`
    : tr('Entirely mined from commit subjects (coarse).');
  return rows + `<div class="note">${esc(note)}</div>`;
}

document.addEventListener('click', (e) => {
  const btn = e.target.closest && e.target.closest('.boardbtn');
  if (btn) toggleBoard(btn.dataset.project);
});

/** Flags travel as identifiers so scoring can match them; only display is translated. */
function flagText(flag) {
  const m = /^([a-z-]+)\((\d+)\)$/.exec(flag);
  return m ? tr(m[1]) + '(' + m[2] + ')' : tr(flag);
}

translateStatic();
connect();

/**
 * Notifications.
 *
 * The whole point of this tool is the moment an agent stops in a window you are
 * not looking at, so a notification that arrives late or not at all is the
 * feature failing. Three rules keep it trustworthy:
 *
 * - Only WAITING_PERMISSION and ERRORED interrupt. WAITING_INPUT is the normal
 *   end of every turn; notifying on it would train you to ignore all of them.
 * - Nothing is notified twice for the same session and state.
 * - The body names the project and the tool, because "a session is waiting" is
 *   not enough to decide whether to switch windows.
 */
const notified = new Map();

function labelFor(sessionId) {
  if (!report) return sessionId.slice(0, 8);
  for (const p of report.projects)
    for (const s of p.sessions)
      if (s.sessionId === sessionId) return p.displayName + ' · ' + (s.name || sessionId.slice(0, 8));
  return sessionId.slice(0, 8);
}

function notify(c) {
  const loud = c.to === 'WAITING_PERMISSION' || c.to === 'ERRORED';
  if (!loud) return;
  const key = c.sessionId + ':' + c.to;
  if (notified.get(key) === c.subReason) return;
  notified.set(key, c.subReason);

  const title = c.to === 'WAITING_PERMISSION' ? tr('Waiting for permission') : tr('The agent errored');
  const body = labelFor(c.sessionId) + (c.subReason ? ' · ' + c.subReason : '');
  if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
    // `tag` collapses repeats into one notification rather than stacking them.
    new Notification(title, { body, tag: key, requireInteraction: c.to === 'WAITING_PERMISSION' });
  }
  document.title = '● ' + title;
  setTimeout(() => { document.title = 'VibeTracker'; }, 20000);
}

if (typeof Notification !== 'undefined' && Notification.permission === 'default') {
  document.addEventListener('click', () => Notification.requestPermission(), { once: true });
}
</script>
</body>
</html>
